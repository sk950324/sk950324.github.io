# 기본 정보와 왼쪽 프로필을 수정하는 파일입니다. 수정 후 미리보기 서버를 재시작하세요.
locale: en-US
site_theme: default
title: Seongkyu Choi
title_separator: "|"
name: Seongkyu Choi
description: "Computer vision research for autonomous driving and robotics."
url: "https://sk950324.github.io"
baseurl: ""
repository: "sk950324/sk950324.github.io"
timezone: Asia/Seoul

author:
  avatar: profile.png
  name: Seongkyu Choi
  bio: "M.S. in Artificial Intelligence. Research interests: computer vision for autonomous driving and robotics."
  location: South Korea
  employer: Gachon University
  email: seongkyu950324@gmail.com
  github: sk950324
  googlescholar: "https://scholar.google.com/citations?user=ViAYhlAAAAAJ&hl=ko"

publication_category:
  manuscripts:
    title: Journal Articles

breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
comments:
  provider: false
atom_feed:
  hide: true
analytics:
  provider: false

include:
  - _pages
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - AGENTS.md
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - LICENSE-academicpages
  - README.md
  - local
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
encoding: utf-8
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

collections:
  publications:
    output: true
    permalink: /publications/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
