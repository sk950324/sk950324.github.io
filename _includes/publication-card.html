{% assign publication = include.publication %}
<article class="publication-card">
  {% if publication.image %}
  <a class="publication-card__image" href="{{ publication.url | relative_url }}">
    <img src="{{ publication.image | relative_url }}" alt="{{ publication.image_alt | escape }}" loading="lazy">
  </a>
  {% endif %}
  <div class="publication-card__body">
    <h3><a href="{{ publication.url | relative_url }}">{{ publication.title }}</a></h3>
    <p class="publication-card__authors">{{ publication.authors | escape }}</p>
    <p><em>{{ publication.venue }}</em>, {{ publication.year }}</p>
    <p>{{ publication.summary }}</p>
    <p class="publication-card__links">
      {% if publication.paperurl %}
        <a href="{{ publication.paperurl | relative_url }}">Paper (PDF)</a>
        <span aria-hidden="true"> · </span>
      {% endif %}
      <a href="{{ publication.url | relative_url }}">Details</a>
    </p>
  </div>
</article>
